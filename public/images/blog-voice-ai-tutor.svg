<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9333ea"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <!-- live audio pulse rings -->
  <circle cx="600" cy="330" r="330" fill="none" stroke="#ffffff" stroke-opacity="0.15" stroke-width="4"/>
  <circle cx="600" cy="330" r="250" fill="none" stroke="#ffffff" stroke-opacity="0.25" stroke-width="4"/>
  <circle cx="600" cy="330" r="170" fill="none" stroke="#ffffff" stroke-opacity="0.35" stroke-width="4"/>
  <!-- device -->
  <rect x="490" y="130" width="220" height="400" rx="44" fill="#ffffff"/>
  <rect x="570" y="160" width="60" height="8" rx="4" fill="url(#bg)"/>
  <rect x="560" y="492" width="80" height="8" rx="4" fill="url(#bg)"/>
  <!-- live waveform on screen -->
  <rect x="521" y="315" width="14" height="30" rx="7" fill="#9333ea"/>
  <rect x="545" y="302" width="14" height="55" rx="7" fill="#9333ea"/>
  <rect x="569" y="285" width="14" height="90" rx="7" fill="#9333ea"/>
  <rect x="593" y="265" width="14" height="130" rx="7" fill="#9333ea"/>
  <rect x="617" y="285" width="14" height="90" rx="7" fill="#9333ea"/>
  <rect x="641" y="302" width="14" height="55" rx="7" fill="#9333ea"/>
  <rect x="665" y="315" width="14" height="30" rx="7" fill="#9333ea"/>
  <!-- always-on recording indicator -->
  <circle cx="520" cy="165" r="20" fill="none" stroke="#ec4899" stroke-opacity="0.5" stroke-width="4"/>
  <circle cx="520" cy="165" r="10" fill="#ec4899"/>
</svg>
