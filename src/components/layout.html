<template is="layout" title="string" description="string">
  <!DOCTYPE html>
  <html lang="{{lang || 'en'}}">
    <head>
      <meta charset="UTF-8" />
      <meta name="viewport" content="width=device-width, initial-scale=1.0" />
      <script>
        // Runs before CSS/first paint so dark mode applies immediately on
        // every full page load - without this, navbar.js only sets the
        // class after Alpine loads, causing a light-mode flash on every navigation.
        (function () {
          try {
            if (localStorage.getItem("theme") === "dark") {
              document.documentElement.classList.add("dark");
            }
          } catch (e) {}
        })();
      </script>
      <title>{{props.title}}</title>
      <meta name="description" content="{{props.description}}" />
      <link rel="icon" type="image/png" href="/images/favicon.png" />

      <meta name="robots" content="noindex, nofollow" if="!canonicalUrl" />
      <link rel="canonical" href="{{canonicalUrl}}" if="canonicalUrl" />
      <link
        map="alt of hreflangAlternates"
        rel="alternate"
        hreflang="{{alt.lang}}"
        href="{{alt.url}}"
        if="canonicalUrl"
      />

      <!-- Open Graph -->
      <meta property="og:type" content="website" if="canonicalUrl" />
      <meta property="og:url" content="{{canonicalUrl}}" if="canonicalUrl" />
      <meta property="og:title" content="{{props.title}}" if="canonicalUrl" />
      <meta
        property="og:description"
        content="{{props.description}}"
        if="canonicalUrl"
      />
      <meta
        property="og:image"
        content="https://austinbrage.me/images/og-image.jpg"
        if="canonicalUrl"
      />
      <meta property="og:image:width" content="1200" if="canonicalUrl" />
      <meta property="og:image:height" content="657" if="canonicalUrl" />

      <!-- Twitter / X Card -->
      <meta
        name="twitter:card"
        content="summary_large_image"
        if="canonicalUrl"
      />
      <meta name="twitter:title" content="{{props.title}}" if="canonicalUrl" />
      <meta
        name="twitter:description"
        content="{{props.description}}"
        if="canonicalUrl"
      />
      <meta
        name="twitter:image"
        content="https://austinbrage.me/images/og-image.jpg"
        if="canonicalUrl"
      />

      <!-- CSS Styles -->
      <link rel="stylesheet" href="/css/{{cssBundle}}" if="cssBundle" />
      <link
        rel="stylesheet"
        href="/css/layout.css{{timestamp ? `?v=${timestamp}` : ''}}"
        if="!cssBundle"
      />
      <link
        rel="stylesheet"
        href="/css/navbar.css{{timestamp ? `?v=${timestamp}` : ''}}"
        if="!cssBundle"
      />
      <link
        rel="stylesheet"
        href="/css/hero.css{{timestamp ? `?v=${timestamp}` : ''}}"
        if="!cssBundle"
      />
      <link
        rel="stylesheet"
        href="/css/experience-section.css{{timestamp ? `?v=${timestamp}` : ''}}"
        if="!cssBundle"
      />
      <link
        rel="stylesheet"
        href="/css/projects-section.css{{timestamp ? `?v=${timestamp}` : ''}}"
        if="!cssBundle"
      />
      <link
        rel="stylesheet"
        href="/css/blogs-section.css{{timestamp ? `?v=${timestamp}` : ''}}"
        if="!cssBundle"
      />
      <link
        rel="stylesheet"
        href="/css/footer.css{{timestamp ? `?v=${timestamp}` : ''}}"
        if="!cssBundle"
      />
      <link
        rel="stylesheet"
        href="/css/contact.css{{timestamp ? `?v=${timestamp}` : ''}}"
        if="!cssBundle"
      />
      <link
        rel="stylesheet"
        href="/css/projects.css{{timestamp ? `?v=${timestamp}` : ''}}"
        if="!cssBundle"
      />
      <link
        rel="stylesheet"
        href="/css/blogs.css{{timestamp ? `?v=${timestamp}` : ''}}"
        if="!cssBundle"
      />
      <link
        rel="stylesheet"
        href="/css/project.css{{timestamp ? `?v=${timestamp}` : ''}}"
        if="!cssBundle"
      />
      <link
        rel="stylesheet"
        href="/css/blog.css{{timestamp ? `?v=${timestamp}` : ''}}"
        if="!cssBundle"
      />
      <link
        rel="stylesheet"
        href="/css/syntax-highlight.css{{timestamp ? `?v=${timestamp}` : ''}}"
        if="!cssBundle"
      />
      <link
        rel="stylesheet"
        href="/css/experience.css{{timestamp ? `?v=${timestamp}` : ''}}"
        if="!cssBundle"
      />
      <link
        rel="stylesheet"
        href="/css/service-down.css{{timestamp ? `?v=${timestamp}` : ''}}"
        if="!cssBundle"
      />
      <link
        rel="stylesheet"
        href="/css/not-found.css{{timestamp ? `?v=${timestamp}` : ''}}"
        if="!cssBundle"
      />

      <!-- Client Javascript -->
      <script defer src="/js/{{jsBundle}}" if="jsBundle"></script>
      <script
        defer
        src="/js/navbar.js{{timestamp ? `?v=${timestamp}` : ''}}"
        if="!jsBundle"
      ></script>
      <script
        defer
        src="/js/contact.js{{timestamp ? `?v=${timestamp}` : ''}}"
        if="!jsBundle"
      ></script>

      <!-- ALPINE -->
      <script
        defer
        src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"
      ></script>
    </head>
    <body>
      <slot></slot>
    </body>
  </html>
</template>
