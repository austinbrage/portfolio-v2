<layout
  title="{{t('service-down-page-title')}}"
  description="{{t('service-down-page-description')}}"
>
  <main class="service-down-container">
    <div class="service-down-theme-toggle" x-data="navbar()">
      <button
        @click="toggleTheme()"
        class="ui-navbar-icon-btn"
        aria-label="Toggle theme"
      >
        <svg x-show="theme === 'light'" class="ui-navbar-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"></path>
        </svg>
        <svg x-show="theme === 'dark'" class="ui-navbar-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="4"></circle>
          <path d="M12 2v2"></path>
          <path d="M12 20v2"></path>
          <path d="m4.93 4.93 1.41 1.41"></path>
          <path d="m17.66 17.66 1.41 1.41"></path>
          <path d="M2 12h2"></path>
          <path d="M20 12h2"></path>
          <path d="m6.34 17.66-1.41 1.41"></path>
          <path d="m19.07 4.93-1.41 1.41"></path>
        </svg>
      </button>
    </div>

    <div class="service-down-bg">
      <div class="service-down-orb service-down-orb-1"></div>
      <div class="service-down-orb service-down-orb-2"></div>
    </div>

    <div class="service-down-card">
      <div class="service-down-icon-wrapper">
        <div class="service-down-pulse-ring"></div>
        <div class="service-down-icon-glow"></div>
        <div class="service-down-icon">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            class="service-down-icon-svg"
          >
            <rect x="2" y="2" width="20" height="8" rx="2" ry="2"></rect>
            <rect x="2" y="14" width="20" height="8" rx="2" ry="2"></rect>
            <line x1="6" y1="6" x2="6.01" y2="6"></line>
            <line x1="6" y1="18" x2="6.01" y2="18"></line>
          </svg>
        </div>
      </div>

      <h1 class="service-down-title">{{t('service-down-title')}}</h1>
      <p class="service-down-subtitle">{{t('service-down-subtitle')}}</p>

      <div class="service-down-alert">
        <p class="service-down-alert-text">{{t('service-down-message')}}</p>

        <div class="service-down-status">
          <span class="service-down-status-dot"></span>
          <p class="service-down-status-text">
            {{t('service-down-status-label')}}
            <span class="service-down-status-value"
              >{{t('service-down-status-disrupted')}}</span
            >
          </p>
        </div>
      </div>

      <div class="service-down-actions">
        <button
          onclick="window.location.reload()"
          class="service-down-btn service-down-btn-primary"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="20"
            height="20"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            class="service-down-btn-icon service-down-refresh-icon"
          >
            <path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"></path>
            <path d="M21 3v5h-5"></path>
            <path
              d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"
            ></path>
            <path d="M8 16H3v5"></path>
          </svg>
          {{t('service-down-refresh-button')}}
        </button>

        <a href="/{{lang}}" class="service-down-btn service-down-btn-secondary">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="20"
            height="20"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            class="service-down-btn-icon service-down-arrow-icon"
          >
            <path d="m12 19-7-7 7-7"></path>
            <path d="M19 12H5"></path>
          </svg>
          {{t('service-down-home-button')}}
        </a>
      </div>

      <div class="service-down-contact">
        <p class="service-down-contact-title">
          {{t('service-down-assistance-title')}}
        </p>
        <div class="service-down-contact-links">
          <a href="mailto:{{email}}" class="service-down-contact-link">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="16"
              height="16"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              class="service-down-contact-icon"
            >
              <path d="m22 7-8.991 5.727a2 2 0 0 1-2.009 0L2 7"></path>
              <rect x="2" y="4" width="20" height="16" rx="2"></rect>
            </svg>
            <span>{{t('service-down-email-label')}}</span>
          </a>
        </div>
      </div>
    </div>
  </main>
</layout>
